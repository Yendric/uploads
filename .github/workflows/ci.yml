name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FFMPEG_PATH: /home/runner/.ffmpeg/ffmpeg
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, gd, exif
          coverage: none

      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ffmpeg
          key: ffmpeg-static-linux64-gpl

      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/.ffmpeg
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C /home/runner/.ffmpeg --wildcards '*/bin/ffmpeg'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ziggy wordt vanuit vendor/ geresolved (tsconfig paths); alleen de types zijn nodig.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
